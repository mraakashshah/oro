version: 3
allow:
  depOnAnyVendor: true
  deepScan: true
excludeFiles:
  - "archive/.+"
  - "references/.+"
  - "ad_hoc/.+"
  - "\\.worktrees/.+"
  - "\\.claude/worktrees/.+"
  - "readme_test\\.go"

components:
  cmd:
    in: cmd/**
  internal:
    in: internal/**
  pkg:
    in: pkg/**
  tests:
    in: tests/**

deps:
  cmd:
    mayDependOn:
      - internal
      - pkg
  internal:
    mayDependOn:
      - internal
      - pkg
  pkg:
    mayDependOn:
      - pkg
  tests:
    mayDependOn:
      - cmd
      - internal
      - pkg
