decisions:
  - manual_merge_threshold: >
      When oro work times out after QG passes and commit exists on branch,
      manually merge rather than relaunching. Saves 20+ min per bead.
  - opus_for_complex_beads: >
      Sonnet fails on dispatcher-heavy beads due to context limits.
      Opus has more headroom (65%/85% vs 50%/70%) but still times out on slow QG.

findings:
  - oro_work_timeout_bottleneck: >
      dispatcher test suite takes 77s. QG takes 5+ min total. Workers that
      modify pkg/dispatcher/ burn 15 min on research + TDD then hit timeout
      during QG. Need either longer timeouts or incremental QG.
  - workers_never_commit_before_qg: >
      Workers run QG pre-commit, so when killed all work is lost.
      Should commit first, then run QG, so retries can build on prior work.
  - merge_conflict_resolution: >
      When two workers modify the same test file, manual rebase is needed.
      Must use GIT_DIR/GIT_WORK_TREE env vars (no_cd_guard blocks cd into worktrees).

