decisions:
  - stayed_at_5_workers: >
      32GB RAM, ~3.4GB/worker. 5 is the sweet spot. Dispatcher auto-scaled
      to 7 via SpawnWorkerForBead but we restarted at 5.
  - remove_worker_on_send_fail: >
      Changed from buffering 10 messages before removal to immediate removal.
      UDS write failure = connection permanently dead, no recovery possible.

findings:
  - merge_race_window: >
      Race between rebase (under rebaseLock) and ff-only (under ffLock).
      Another merge can complete between the two locks, advancing main.
  - zombie_pattern_two_paths: >
      Dead-socket workers could enter from bead_closed_externally (after merge)
      and from tryAssign (after worker process dies). Both needed fixing.
  - bead_throughput: >
      Median assign-to-merge: 8.4 min. Range: 1.6-9.9 min. Fast ones are
      retries with prior work. ~35-40 beads/hour at 5 workers.

