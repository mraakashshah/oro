goal: >
  Implemented stream-json worker observability (oro-vpn7). Workers now use
  --output-format stream-json to parse NDJSON events, producing human-readable
  activity logs (-> Read, -> Bash) and result metadata (turns, cost,
  permission_denials). Found and fixed the root cause of silent worker death:
  --output-format stream-json requires --verbose with -p (exit status 1 otherwise).

now: >
  1. File bug bead for "already-done detection" — workers that find code already
     on main should detect this and close the bead instead of reporting failure
  2. Investigate the early-exit pattern (4 tool calls then quit) seen in some runs —
     may be related to scanner buffer size (fixed with 10MB buffer) or session-specific
  3. Consider adding text echo to processOutput (worker.go) too, not just DrainOutput —
     currently only oro work gets text visibility, oro start workers don't

test: |
  go test ./pkg/worker/... -count=1 -timeout 120s
  go test ./cmd/oro/... -count=1 -timeout 120s
  # Integration: rebuild and run oro work on a bead
  make install && oro work <bead-id> --timeout 10m
  # Check output log for tool activity + result metadata:
  cat ~/.oro/workers/work-<bead-id>/output.log

