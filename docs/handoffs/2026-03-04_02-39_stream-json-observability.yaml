    notes: >
      Parse result event metadata (num_turns, cost, permission_denials,
      stop_reason, subtype). FormatResult displays at end of output.
      Stream line counter shows total vs unknown NDJSON events.
      10MB scanner buffer for large tool results.

decisions:
  - stream_json_over_text: >
      --output-format stream-json chosen over plain text because claude -p
      produces zero stdout/stderr for tool calls in text mode. Stream-json
      emits NDJSON with tool_use content blocks.
  - verbose_flag_required: >
      Claude CLI enforces --verbose when combining -p with --output-format
      stream-json. This was undocumented and caused silent exit status 1.
  - text_echo_to_writers: >
      Added text content echo to output writers (not just tool activity)
      because seeing Claude's reasoning is essential for debugging "no commits"
      failures. Without it, we only see WHAT tools ran, not WHY.
  - 10mb_scanner_buffer: >
      Default bufio.Scanner buffer (64KB) may truncate large tool results.
      Increased to 10MB to handle Read of large files.

findings:
  - stream_json_event_types: >
      83 NDJSON lines per session, 47 are "unknown" types we don't parse
      (user, system, tool_progress). Only assistant and result types needed
      for observability.
  - permission_denials_field: >
      Result events include permission_denials[] array. None seen in test
      runs — permissions are not the issue.
  - already_done_beads: >
      Multiple beads (oro-tm8m.19, oro-tm8m.14, oro-tm8m.17) were already
      implemented on main but not closed. Workers correctly identify this
      but can't commit (nothing changed), causing oro work to report failure.
      This is the actual "silent death" users see — not crashes.

worked:
