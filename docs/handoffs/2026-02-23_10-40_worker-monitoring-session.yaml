findings:
  pre_existing_handoff_tests_were_real_bug: >
    TestDispatcher_Handoff_RespawnsWorker and related tests were failing because
    handleHandoff was missing from the message dispatch switch. Traced by oro-0knc worker.
    Now fixed in ba0e423. All handoff tests pass.
  xs8l_fix_landed_in_main_worktree: >
    The first xs8l worker (PID 35642, started 9:25AM) wrote escalator.go changes to the
    MAIN working directory instead of its worktree. Discovered via git status. Changes were
    correct and committed directly as 170603d.
  oro_stop_force_doesnt_kill_workers: >
    oro stop --force only kills the dispatcher process. Worker processes remain running and
    reconnect to the new dispatcher after oro start. Zombie workers accumulate across restarts.
    Must pkill worker processes manually to fully drain.
  scale_directive_is_additive: >
    oro directive scale N ADDS N to current target (not set-to-N). This is intended behavior.
    Don't try to scale down by running scale 3 — use scale -N or kill workers directly.
  qg_failures_blocked_all_workers: >
    Pre-existing TestDispatcher_Handoff_* failures caused quality_gate_rejected events for
    every bead touching dispatcher tests. Workers got auto-reviewed around them by escalation
    agents citing "pre-existing failures" — but this masked real issues. The real fix (oro-0knc)
    restored the missing handleHandoff call that was accidentally removed.
  cwz13_will_conflict: >
    oro-cwz.13 worker is modifying pkg/dispatcher/dispatcher.go and dispatcher_test.go.
    The xzuh fix (b9922de) also touched those files. When cwz.13 rebases, it will conflict.
    Watch for MERGE_CONFLICT escalation and resolve manually if escalation agent fails.

decisions:
  did_not_restart_dispatcher_early: >
    Waited until workers had no uncommitted work before restarting dispatcher to avoid
    losing in-progress changes. Correct approach — but note that oro stop --force doesn't
    kill workers anyway, so restart timing matters less than expected.
  manually_committed_xs8l_fix: >
    Found xs8l fix in main working tree (worker wrote to wrong dir). Verified tests pass,
    committed directly to main rather than routing back through worker. Faster and correct.
  let_workers_drain_naturally: >
    With 8 workers and target=2, chose not to kill excess workers. They will exit after
    completing their beads. No ongoing harm.

