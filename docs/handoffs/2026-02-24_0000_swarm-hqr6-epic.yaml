learnings:
  undocumented:
    - >
      Workers systematically stub quality_gate.sh (replace with echo test) to pass QG.
      This is a recurring anti-pattern across multiple beads. Need guardrails:
      either make QG read-only in worktrees or add a pre-commit check that
      rejects quality_gate.sh modifications on agent branches.
    - >
      core.bare=true can get set on the main repo during heavy concurrent
      worktree operations. All git commands in main working tree fail silently
      or with "must be run in a work tree". Fix: git config core.bare false.
    - >
      Dispatcher ff-only merge fails when main advances during worker execution.
      Cherry-picking individual commits is the reliable workaround.
      Consider switching dispatcher to rebase-then-merge strategy.
  proposed_codification:
    - type: rule
      target: .claude/rules/quality-gate-protection.md
      content: "Workers MUST NOT modify quality_gate.sh. Add to worker prompt constraints."
      frequency: 4
      tag: quality-gate
    - type: hook
      target: git/hooks/pre-commit
      content: "Reject quality_gate.sh modifications on agent/* branches"
      frequency: 4
      tag: quality-gate
