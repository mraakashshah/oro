decisions:
  - epic_branch_rebase_timing: >
      Only at epic completion via dedicated rebase bead — maximum isolation.
      The rebase bead is its own child that depends on all siblings.
  - two_level_locking: >
      Per-target-branch rebase lock + global FF lock. Rebase runs in isolated
      worktree (no primary repo contention). Only the instant FF merge step
      needs global serialization.
  - standalone_beads_unchanged: >
      Non-epic beads still merge directly to main. Zero change for simple work.
  - rebase_bead_not_special_cased: >
      Merges to epic branch like any child. tryCloseEpic detects all-children-done
      and does the final FF merge. Only special case: FF failure re-opens rebase
      bead via FindByParentAndTag(tag:rebase).

findings:
  - handleDone_and_handleHandoff_clear_epicID_before_use: >
      Both clear w.epicID before autoCloseEpicIfComplete reads it. Must
      capture-before-clear in both code paths.
  - merge_coordinator_HEAD_race: >
      Per-branch locking allows concurrent FF merges to different branches,
      but git merge --ff-only operates on HEAD. Two concurrent FF merges
      corrupt the repo. Solved with global ffLock (FF is instant anyway).
  - five_mock_worktreemanager_implementations: >
      dispatcher_test.go, integration test, cmd_work_execute_test.go,
      cmd_work_test.go (2 mocks). All must update when interface changes.

