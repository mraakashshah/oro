decisions:
  - group_by_file_not_pattern: >
      Beads must be grouped by target file to avoid merge conflicts. oro-6fma.7.1
      wasted 6+ hours because sibling beads modified the same file concurrently.
  - no_ceo_cognitive_patterns: >
      CEO patterns (inversion reflex, focus as subtraction) are for product decisions.
      Oro is a code factory — only engineering patterns apply.
  - askuserquestion_architect_manager_only: >
      Workers and ops never talk to users. AskUserQuestion format only for
      architect (tmux pane 0) and manager (tmux pane 1).
  - anti_sycophancy_not_for_workers: >
      Workers produce code, not opinions. Anti-sycophancy only matters when an LLM
      produces text a human reads and acts on (architect, manager, ops review).
  - monitor_cron_two_phase: >
      Phase 1 checks failures. Phase 2 detects stalls (no merge in 20min with busy
      workers) and investigates autonomously. This caught the 6-hour stall on
      oro-6fma.7.1 that the original cron missed.

findings:
  - stale_line_numbers_killed_productivity: >
      AC with hardcoded line numbers (dispatcher.go:510) went stale when sibling
      beads shifted lines. Workers cycled for 6+ hours. Fix: beadcraft skill now
      says "use symbol names, never line numbers" and worker prompt says "line
      numbers are approximate — grep for the symbol."
  - bd_ready_bug_after_dolt_recovery: >
      After dolt corruption + recovery, bd ready treated closed blocking deps and
      parent-child deps as still blocking. Manual dep removal required. Root cause
      likely in bd's dependency resolution after backup restore.
  - dispatcher_silent_death: >
      assignLoop goroutine panics are recovered by safeGo but the loop never
      restarts. Dispatcher stays alive but stops assigning. Fixed with
      restart-on-panic wrapper (oro-9wz5).
  - oversized_beads_block_pipelines: >
      oro-6fma.7 (8 sites across 6 packages) blocked 4 downstream beads for 5+
      hours. Fixed with: OVERSIZED_BEAD pre-assignment check, beadcraft
      cross-boundary heuristic, and ops decomposition playbook.

