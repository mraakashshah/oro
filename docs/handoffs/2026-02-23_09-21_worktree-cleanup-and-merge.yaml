    - "oro stop --force leaves completed worktrees unmerged — in_progress claims never reset (session, git+oro)"
    - "cmd/oro-dash files need git add -f due to .gitignore 'oro-dash' pattern (session, git+go)"
    - "snapshot .golden files always conflict on concurrent dashboard beads — standard resolution: checkout --ours, rebase --continue, -update flag (session, go)"
