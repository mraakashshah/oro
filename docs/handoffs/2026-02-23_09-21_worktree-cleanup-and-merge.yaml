findings:
  oro_stop_force_is_lossy: >
    oro stop --force kills worker processes mid-flight. Workers complete beads and commit
    to worktree branches but never reach the rebase+merge steps (work-bead Steps 10-12).
    Result: completed work stranded in branches, in_progress claims never reset.
    This is a systemic gap — the system needs graceful drain or post-stop recovery.
  worker_quality_gate_escapes: >
    3 bugs escaped worker quality gates into merged commits:
    (1) i8i8.7: prevCol<=0 instead of <0 broke left-column navigation (h key)
    (2) i8i8.2: _ = m.activeView stub instead of m.activeView = WorkersView broke 'w' key
    (3) multiple: snapshot .golden files conflicted and needed regeneration via -update flag
    All were introduced during snapshot conflict resolution — workers took wrong sides.
  gitignore_affects_oro_dash: >
    .gitignore contains 'oro-dash' which matches cmd/oro-dash/** path components.
    git add of files under cmd/oro-dash/ requires -f flag. All workers hitting this.
  snapshot_conflicts_are_routine: >
    cmd/oro-dash/testdata/*.golden files conflict on every concurrent dashboard bead.
    Resolution: checkout --ours (take main), add -f, continue rebase, run tests with
    -update flag to regenerate, amend commit. This is now a known pattern.

decisions:
  discard_hfvx_worktree: >
    oro-hfvx worktree had 28-file -1082 line diff from very old branch base. Main already
