  proposed_codification:
    - type: rule
      target: .claude/rules/worktree-merge-protocol.md
      content: >
        When merging multiple worktrees: rebase one at a time. After each merge, main moves.
        Re-add worktree (git worktree add) and re-rebase before ff-only if main moved.
        Never run parallel rebase+merge sequences.
      frequency: 6
      tag: git
    - type: rule
      target: .claude/rules/snapshot-conflict-resolution.md
      content: >
        For cmd/oro-dash/testdata/*.golden conflicts: checkout --ours, add -f (gitignore),
        rebase --continue, then run 'go test ./cmd/oro-dash/... -run TestSnapshot_X -update'
        to regenerate. Amend commit to include updated snapshots. Pattern applies to all
        snapshot-based test files.
      frequency: 3
      tag: go
