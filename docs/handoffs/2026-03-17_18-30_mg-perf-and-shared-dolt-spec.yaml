decisions:
  - osc_guard_whitelist: >
      Whitelist only j/k/g/q through the OSC guard window. Blacklisting fragments
      was a losing game — every new phantom char needed a patch. Whitelist is safer.
  - startup_guard_quit_only: >
      Only q/esc/ctrl+c pass the 500ms startup guard. Prevents any phantom key
      from activating modes (filter, help, palette).
  - active_only_polling: >
      Poll only non-closed issues every 5s. Closed issues loaded at startup (50)
      and background-hydrated. 5x faster, 200x less data per poll.
  - shared_dolt_port_13307: >
      Fixed port 13307 for shared server. Avoids MySQL 3306/3307 conflict.
      DerivePort range starts at 13307 but setup migrates away from per-project.
  - shared_dolt_client_config: >
      Only bd dolt set port 13307 needed per project. data-dir is server-side
      only (dolt sql-server --data-dir flag). bd doesn't support set data-dir
      in server mode.

findings:
  - dolt_server_keeps_dying: >
      Root cause was duplicate .doltcfg directories preventing restart, plus
      corrupted metadata.json from a bad Python script. Not a systemic issue.
  - bd_pid_file_compat: >
      bd looks for .beads/dolt-server.{pid,port} to detect running server.
      Shared server must write these per-project or bd spawns competing servers.

worked:
