    Cherry-pick instead of rebase while any worktrees are active.
    When ALL worktrees removed, can rebase for cleaner history.
  worktree_git_dir: >
    git status/cherry-pick requires explicit --git-dir and --work-tree flags
    because the main repo appears as (bare) when worktrees exist.
    Use: git --git-dir=/Users/as21/codehouse/oro/.git --work-tree=/Users/as21/codehouse/oro <cmd>
  go_mutesting_location: >
    Run go-mutesting from /Users/as21/codehouse/oro (main repo) targeting
    pkg/dispatcher/file.go. Write test changes to worktree test files.
    Run go test with -C pointing to worktree. Commit with git -C worktree.
  pre_commit_hook_fix: >
    eclo2 agent added env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE -u GIT_PREFIX
    to the go test invocation in .git/hooks/pre-commit to prevent TestExecCommandRunner_Run_WithGitRepo
