findings:
  - dolt_journal_fragile: >
      Dolt journal corruption is unrecoverable without full re-init.
      Truncation loses root hashes. Keep SQLite backup as safety net.
  - bd_update_not_persisting: >
      After Dolt re-init, auto-commit defaults to off. Dispatcher writes
      land in working set but reads may not see them. Setting
      dolt.auto-commit: "on" in config.yaml fixes this.
  - merge_error_leaves_worktree: >
      When mergeAndComplete gets a non-conflict error, it returns without
      cleanup. Observed: oro-4mu1.1 had code on main from prior session,
      current merge failed with ff-only mismatch, bead left open.

