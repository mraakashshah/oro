      This masked the wrong hardStop values in TestHardStopThresholds:
      handleContextThreshold triggered at pct=85 (above real hardStop=75)
      but SendHandoff blocked on the unread pipe, preventing killProc.
      Test appeared to pass because Killed() was false during the sleep.

