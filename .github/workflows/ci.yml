name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Stage assets for go:embed (required for build/lint/test)
      - name: Stage assets
        run: make stage-assets
        env:
          ORO_HOME: ${{ github.workspace }}/.oro-ci

      # Tier 1: Formatting
      - name: gofumpt
        run: test -z "$(go tool gofumpt -l cmd internal pkg)"

      - name: goimports
        run: test -z "$(go tool goimports -l cmd internal pkg)"

      # Tier 2: Linting
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout 5m ./cmd/... ./internal/... ./pkg/...

      # Tier 3: Architecture
      - name: beadstore import boundary
        run: scripts/check-beadstore-imports.sh

      - name: go-arch-lint
        run: |
          go install github.com/fe3dback/go-arch-lint@v1.14.0
          go-arch-lint check --project-path .

      # Tier 4: Testing + Coverage (83% minimum, excluding pkg/mg TUI packages)
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli

      - name: Test + Coverage
        run: |
          # Run all tests for correctness (including pkg/mg TUI)
          go test -race -shuffle=on ./internal/... ./pkg/... ./cmd/...
          # Measure coverage excluding pkg/mg (terminal UI — low testability by design)
          NON_TUI=$(go list ./internal/... ./pkg/... ./cmd/... | grep -v 'pkg/mg')
          go test -race -shuffle=on -coverprofile=coverage.out $NON_TUI
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage (non-TUI): ${COVERAGE}%"
          awk "BEGIN {exit ($COVERAGE < 82)}"

      # Tier 5: Security
      - name: govulncheck
        run: go tool govulncheck ./...

      # Tier 6: Build
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Clean up staged assets
      - name: Clean assets
        if: always()
        run: make clean-assets

  cgo-free:
    name: CGO-free Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Stage assets
        run: make stage-assets
        env:
          ORO_HOME: ${{ github.workspace }}/.oro-ci

      - name: Build (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build ./cmd/oro ./cmd/oro-search-hook

      - name: Test (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go test -count=1 ./cmd/... ./internal/... ./pkg/...

      - name: Clean assets
        if: always()
        run: make clean-assets

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: find . -name '*.sh' -not -path './references/*' -not -path './archive/*' -not -path './.worktrees/*' -exec shellcheck --severity=info {} +

  docs:
    name: Docs & Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JS tools
        run: npm ci

      - name: markdownlint
        run: |
          npx markdownlint-cli2 --config .markdownlint.yml \
            "docs/**/*.md" "*.md" "!references/**" "!archive/**"

      - name: yamllint
        run: |
          pip install yamllint
          find . \( -name '*.yml' -o -name '*.yaml' \) \
            -not -path './references/*' -not -path './archive/*' \
            -not -path './.worktrees/*' -not -path './node_modules/*' \
            | xargs yamllint -d relaxed --no-warnings

      - name: biome (json)
        run: npx biome check --files-ignore-unknown=true docs/ .github/ *.json

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Tier 1: Formatting
      - name: ruff format
        run: uvx ruff format --check .

      # Tier 2: Linting
      - name: ruff check
        run: uvx ruff check .

      - name: pylint (errors only)
        run: |
          find . -name '*.py' -not -path './references/*' \
            -not -path './archive/*' -not -path './.worktrees/*' -not -path './.venv/*' \
            -not -path './assets/*' -not -path './.claude/*' \
            | xargs uvx pylint --disable=all --enable=E

      # Tier 3: Type checking
      - name: pyright
        run: uvx pyright

      # Tier 4: Testing
      - name: pytest
        run: |
          # Skip tests that require ~/.oro/hooks/ (environment-specific)
          uvx pytest --ignore=tests/test_session_start_extras.py \
                     --ignore=tests/test_validate_agent_completion.py \
                     --ignore=tests/test_worktree_guard.py
