name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:

  incremental-mutation:
    name: Incremental Mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run strict incremental mutation
        run: |
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          bash scripts/quality_gate/mutation.sh \
            --base "$base_sha" \
            --head "${{ github.sha }}" \
            --evidence mutation-evidence.json

      - name: Upload incremental mutation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: incremental-mutation-evidence
          path: mutation-evidence.json
          if-no-files-found: error

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ripgrep is required by scripts/check-task-terminology.sh
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep tmux

      # Stub `claude` so preflight checks pass without bundling the real CLI.
      # The test seam in cmd_start.go intercepts runDaemonOnlyFn, so the stub
      # is never executed — only LookPath presence matters.
      - name: Stub claude binary
        run: |
          mkdir -p "$HOME/.local/bin"
          cat <<'EOF' > "$HOME/.local/bin/claude"
          #!/bin/sh
          echo "claude stub — not for production use" >&2
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/claude"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Stage assets for go:embed (required for build/lint/test)
      - name: Stage assets
        run: make stage-assets
        env:
          ORO_HOME: ${{ github.workspace }}/.oro-ci

      # Tier 1: Formatting
      - name: gofumpt
        run: test -z "$(go tool gofumpt -l cmd internal pkg)"

      - name: goimports
        run: test -z "$(go tool goimports -l cmd internal pkg)"

      # Tier 2: Linting
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout 5m ./cmd/... ./internal/... ./pkg/...

      # Tier 3: Architecture
      - name: beadstore import boundary
        run: scripts/check-beadstore-imports.sh

      - name: go-arch-lint
        run: |
          go install github.com/fe3dback/go-arch-lint@v1.14.0
          go-arch-lint check --project-path .

      # Tier 4: Testing + Coverage (78% minimum, matching local quality gate package scope)
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli

      - name: Test + Coverage
        run: |
          # Run all tests for correctness (including dashboard TUI)
          go test -race -shuffle=on ./internal/... ./pkg/... ./cmd/...
          # Measure coverage for library packages, excluding dashboard TUI packages.
          # Command packages are still tested above, but are not part of the coverage gate.
          COVERAGE_PKGS=$(go list ./internal/... ./pkg/... | grep -v 'pkg/dashboard/' | tr '\n' ' ')
          go test -race -shuffle=on -coverprofile=coverage.out $COVERAGE_PKGS
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage (non-TUI): ${COVERAGE}%"
          awk "BEGIN {exit ($COVERAGE < 78)}"

      # Tier 5: Security
      - name: govulncheck
        run: go tool govulncheck ./...

      # Tier 6: Build
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Clean up staged assets
      - name: Clean assets
        if: always()
        run: make clean-assets

  cgo-free:
    name: CGO-free Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ripgrep is required by scripts/check-task-terminology.sh (run by tests)
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep tmux

      # Stub `claude` so preflight checks pass without bundling the real CLI.
      - name: Stub claude binary
        run: |
          mkdir -p "$HOME/.local/bin"
          cat <<'EOF' > "$HOME/.local/bin/claude"
          #!/bin/sh
          echo "claude stub — not for production use" >&2
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/claude"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Stage assets
        run: make stage-assets
        env:
          ORO_HOME: ${{ github.workspace }}/.oro-ci

      - name: Build (CGO_ENABLED=0)
        run: CGO_ENABLED=0 go build ./cmd/oro ./cmd/oro-search-hook

      - name: Test (CGO_ENABLED=0)
        timeout-minutes: 20
        # -p 1 forces sequential package execution so each "ok PKG" line
        # streams immediately; recent CI hangs produced zero output for
        # 47 minutes, making diagnosis impossible.
        run: CGO_ENABLED=0 go test -count=1 -p 1 -timeout=8m ./cmd/... ./internal/... ./pkg/...

      - name: Clean assets
        if: always()
        run: make clean-assets

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: find . -name '*.sh' -not -path './references/*' -not -path './archive/*' -not -path './.worktrees/*' -exec shellcheck --severity=info {} +

  docs:
    name: Docs & Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JS tools
        run: npm ci

      - name: markdownlint
        run: |
          npx markdownlint-cli2 --config .markdownlint.yml \
            "docs/**/*.md" "*.md" "!references/**" "!archive/**"

      - name: yamllint
        run: |
          pip install yamllint
          find . \( -name '*.yml' -o -name '*.yaml' \) \
            -not -path './references/*' -not -path './archive/*' \
            -not -path './.worktrees/*' -not -path './node_modules/*' \
            | xargs yamllint -d relaxed --no-warnings

      - name: biome (json)
        run: npx biome check --files-ignore-unknown=true docs/ .github/ *.json

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Tier 1: Formatting
      - name: ruff format
        run: uvx ruff@0.16.0 format --check .

      # Tier 2: Linting
      - name: ruff check
        run: uvx ruff@0.16.0 check .

      - name: pylint (errors only)
        run: |
          find . -name '*.py' -not -path './references/*' \
            -not -path './archive/*' -not -path './.worktrees/*' -not -path './.venv/*' \
            -not -path './assets/*' -not -path './.claude/*' \
            | xargs uv run --with pylint pylint --disable=all --enable=E

      # Tier 3: Type checking
      - name: pyright
        run: uv run --with pyright --with pytest pyright

      # Tier 4: Testing
      - name: pytest
        run: |
          # Skip tests that require ~/.oro/hooks/ (environment-specific)
          uv run --with pytest pytest --ignore=tests/test_session_start_extras.py \
                                      --ignore=tests/test_validate_agent_completion.py \
                                      --ignore=tests/test_worktree_guard.py

  oro-portable-qg:
    if: ${{ always() }}
    needs: [go, cgo-free, shell, docs, python, incremental-mutation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every portable gate
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: scripts/ci/require-needs-success.sh "$NEEDS_JSON"
