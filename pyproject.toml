[project]
name = "oro"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cosmic-ray>=8.4.3",
    "pyyaml>=6.0",
]

[tool.uv]
override-dependencies = [
    "greenlet==3.5.4; sys_platform == 'linux'",
]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = ["references", "archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["SIM115"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
extraPaths = ["assets/hooks"]
exclude = ["references", "archive", ".worktrees", ".venv", "tests/conftest.py"]

[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, 'assets/hooks')"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "requires_oro_home: tests that require ~/.oro/ directory structure"
]

[dependency-groups]
dev = [
    "pylint>=4.0.6",
    "pytest>=9.1.1",
]
