<div class="event-feed">
{{- $titles := .Titles -}}
{{- range .Events}}
  <div class="event-feed__item">
    <span class="event-feed__time">{{if gt (len .CreatedAt) 15}}{{slice .CreatedAt 11 16}}{{else}}{{.CreatedAt}}{{end}}</span>
    <span class="event-feed__symbol {{eventSymbolClass .Type}}">{{eventSymbol .Type}}</span>
    <span class="event-feed__text">{{eventSummary . $titles}}</span>
  </div>
{{- end}}
</div>
