# Oro golangci-lint configuration (v2 format)
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: none
  enable:
    # Correctness
    - staticcheck
    - govet
    - ineffassign
    - unused
    - errcheck

    # Error handling
    - errorlint
    - wrapcheck
    - nilerr
    - errname

    # Complexity
    - gocyclo
    - gocognit
    - funlen
    - nestif

    # Structure
    - gochecknoglobals
    - gochecknoinits
    - testpackage

    # Resource safety
    - bodyclose
    - noctx
    - durationcheck

    # Cleanup
    - unconvert
    - unparam
    - nakedret
    - whitespace

    # Duplication
    - dupl

    # Testing
    - thelper

    # Security
    - gosec

    # Style
    - gocritic
    - revive
    - misspell

    # Performance
    - prealloc

  settings:
    gosec:
      excludes:
        - G115 # upstream panic on float constants in ui package
        - G701 # false positive on parameterized SQL queries with ? placeholders

    gocyclo:
      min-complexity: 15

    gocognit:
      min-complexity: 20

    funlen:
      lines: 60
      statements: 40
      ignore-comments: true

    nestif:
      min-complexity: 4

    errcheck:
      check-type-assertions: true
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(

    nakedret:
      max-func-lines: 10

    dupl:
      threshold: 200

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - commentedOutCode

    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: get-return
        - name: string-of-int
        - name: early-return
        - name: unnecessary-stmt

    prealloc:
      simple: true
      range-loops: true
      for-loops: true

  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
          - gocognit
          - gochecknoglobals
          - wrapcheck
          - noctx
          - unparam
          - dupl
          - prealloc
          - gocritic
          - errcheck
          - gosec

      - path: main\.go
        linters:
          - gochecknoinits
          - gochecknoglobals

      # Build-tag-only stub file; package documentation lives on cgo-enabled
      # source files and this file should not force a production diff.
      - path: pkg/codestruct/extractors_nocgo\.go
        text: "package-comments:"
        linters:
          - revive

      # Bubbletea TUI: View/Update funcs are naturally long, models use
      # type assertions, package-level style vars, math/rand for
      # animations (not security), and nested conditionals in rendering.
      - path: pkg/dashboard/views/
        linters:
          - funlen
          - gocyclo
          - gocognit
          - nestif
          - noctx
          - gochecknoglobals
          - errcheck
          - gocritic
          - gosec
          - nilerr
          - prealloc
          - revive
          - testpackage
          - unparam
          - wrapcheck

      # pkg/dashboard contains relocated TUI-style code.
      - path: pkg/dashboard/
        linters:
          - funlen
          - gocyclo
          - gocognit
          - nestif
          - noctx
          - gochecknoglobals
          - errcheck
          - gocritic
          - gosec
          - nilerr
          - prealloc
          - revive
          - testpackage
          - unparam
          - wrapcheck

      # CLI tools legitimately exec subprocesses and write user-supplied
      # paths to stdout — not a web context.
      - path: exec_runner\.go
        linters:
          - gosec
      - path: exec_spawner\.go
        linters:
          - gosec
      - path: cmd_ingest\.go
        linters:
          - gosec
      - path: drain\.go
        linters:
          - gosec

      # The SQLite state DB path is local configuration, not request data.
      # gosec's G703 taint rule flags the v4 backup cleanup path even though
      # it is derived from that configured DB path and created with O_EXCL.
      - path: cmd/oro/db\.go
        text: "G703: Path traversal via taint analysis"
        linters:
          - gosec

      # The /proc stat path is built from an already-validated (>0) int
      # pid against a fixed /proc/%d/stat format string, not user input.
      - path: pkg/storage/process_identity_linux\.go
        text: "G304: Potential file inclusion via variable"
        linters:
          - gosec

formatters:
  enable:
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - oro
